<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Life Manager</title>
  </head>

  <body>
    <div class="container">
      <h1>Welcome to Life Manager</h1>

      <div class="card">
        <h2>Add New Item</h2>
        <form id="add-item-form">
          <input id="item-name" placeholder="Item Name" required />
          <input id="item-price" type="number" step="0.01" placeholder="Initial Price" required />
          <button type="submit">Add Item</button>
        </form>
        <p id="form-message"></p>
      </div>

      <div class="card">
        <h2>Existing Items</h2>
        <ul id="item-list">
          <!-- Items will be dynamically inserted here -->
        </ul>
      </div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
