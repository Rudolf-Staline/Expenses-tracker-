[workspace]
members = [
    "src-tauri",
    "crates/*"
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "1.0" }
sqlx = { version = "0.7", features = ["runtime-async-std-native-tls", "sqlite", "macros", "chrono"] }
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.9"
tokio = { version = "1", features = ["full"] }
strum = { version = "0.26", features = ["derive"] }
dotenvy = "0.15"